!
! OsmoSGSN (1.11.0.1-e746b) configuration saved from vty
!!
!

log stderr blocking-io
 logging filter all 1
 logging color 1
 logging print category-hex 1
 logging print category 0
 logging print thread-id 0
 logging timestamp 0
 logging print file 1
 logging level force-all debug

!
stats interval 5
!
line vty
 no login
!
ns
 timer tns-block 3
 timer tns-block-retries 3
 timer tns-reset 3
 timer tns-reset-retries 3
 timer tns-test 30
 timer tns-alive 3
 timer tns-alive-retries 10
 timer tsns-prov 3
 timer tsns-size-retries 3
 timer tsns-config-retries 3
 timer tsns-procedures-retries 3
 bind udp local
  listen ${EXTERNAL_OSMOSGSN_IP} ${OSMOSGSN_PORT}
  accept-ipaccess
  accept-dynamic-ip-sns
  ip-sns signalling-weight 1 data-weight 1
bssgp

sgsn
 gtp state-dir ./
 gtp local-ip ${EXTERNAL_OSMOSGSN_IP}
 ggsn 0 remote-ip ${OSMOGGSN_IP}
 ggsn 0 gtp-version 1
 ggsn 0 echo-interval 60
 encryption gea 0
 gsup remote-ip ${OSMOHLR_IP}
 gsup remote-port 4222
 auth-policy accept-all
 gsup oap-id 0
 ! apn * ggsn 0
 no cdr filename
 no cdr trap
 cdr interval 600
 no compression rfc1144
 no compression v42bis
