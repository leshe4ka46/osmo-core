!
! OsmoMSC (1.11.1.5-1759) configuration saved from vty
!!
!
log stderr
 logging filter all 1
 logging color 1
 logging print category-hex 0
 logging print category 1
 logging print thread-id 0
 logging print extended-timestamp 1
 logging print level 1
 logging print file basename last
 logging level force-all info

line vty
 no login

cs7 instance 0
 point-code 0.23.1
 asp asp-clnt-OsmoMSC-A-Iu ${OSMOSTP_PORT} 0 m3ua
  remote-ip ${OSMOSTP_IP}
  local-ip ${OSMOMSC_IP}
  role asp
  sctp-role client

network
 network country code 612
 mobile network code 04
 short name OsmoMSC
 long name OsmoMSC
 encryption a5 0 1 2 3 4
 !authentication required
 authentication optional
 rrlp mode none
 mm info 1
 mgw 0
  local-port 2728
  remote-ip ${CORE_NETWORK_GW}
  remote-port ${OSMOMGW_PORT}

smpp
 local-tcp-port 2775
 policy accept-all
 no smpp-first
 system-id smpp-osmo
 esme smpp-osmo
  password 1243
  default-route
  osmocom-extensions

msc
 mncc guard-timeout 180
 ncss guard-timeout 30
 assign-tmsi
 cs7-instance-a 0
 emergency-call route-to-msisdn 1010
mncc-int
 !default-codec tch-f fr
 !default-codec tch-h hr
hlr
 remote-ip ${OSMOHLR_IP}
 remote-port 4222
 ipa-name main-msc
sgs
 local-port 29118
 local-ip 0.0.0.0
 vlr-name vlr.example.net
smsc
 queue max-pending 20
 queue max-failure 1
 database delete-delivered 1
 database delete-expired 1
 validity-period minimum 1
 validity-period default 10080
asci
 disable
 gcr
